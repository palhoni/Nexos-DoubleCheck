[pytest]
testpaths = tests
addopts = --alluredir=allure-results -v -m "not opt_in and not claims"
markers =
    smoke: golden path de fluxo critico
    contract: validacao de JSON Schema
    auth: autenticacao apenas (quem e voce)
    authz: autorizacao/escopo entre perfis e grupos (o que voce pode acessar)
    flow: jornada de usuario cross-endpoint
    claims: oraculo Claims - Swagger/OpenAPI vs realidade (fora da suite padrao)
    regression: teste nascido de um bug real (inclui o ID do bug no nome)
    idempotency: escrita repetida nao deve gerar efeito colateral duplicado
    performance: tempo de resposta dentro do esperado
    create: cria dados reais sem operacao de delete correspondente na API
    opt_in: controla o que fica fora da suite padrao (junto com claims)
    pending: golden path identificado mas ainda nao implementado (usar pytest.mark.skip com reason, nunca silencioso)
